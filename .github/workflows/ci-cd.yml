name: CI

on:
  push:
    branches: [main]
  pull_request:

# Token cua workflow chi duoc doc repo (nguyen tac quyen toi thieu)
permissions:
  contents: read

# Push moi len cung branch/PR thi huy lan chay cu dang do
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build, test & coverage
        working-directory: backend
        run: ./mvnw -B verify
      - name: Coverage summary
        if: always()
        working-directory: backend
        run: |
          [ -f target/site/jacoco/jacoco.csv ] || exit 0
          awk -F, 'NR>1 {m+=$8; c+=$9} END {printf "### Backend coverage\nLine coverage: **%.1f%%** (%d/%d)\n", 100*c/(c+m), c, c+m}' \
            target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

  ai-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-worker/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check . ../integration-tests --output-format github
      - name: Test & coverage
        run: |
          pytest --cov --cov-report=term --cov-report=html
          coverage report --format=markdown | sed '1i ### AI worker coverage' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ai-worker-coverage
          path: ai-worker/htmlcov/
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Test & coverage
        run: |
          npm run test:coverage
          node -e "const t=require('./coverage/coverage-summary.json').total; console.log('### Frontend coverage\nLines: **'+t.lines.pct+'%** · Branches: '+t.branches.pct+'% · Functions: '+t.functions.pct+'%')" >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore

  # Dung toan bo he thong bang Docker (dong thoi kiem tra 2 Dockerfile build duoc)
  # roi chay test end-to-end qua API that: upload -> S3 -> SQS -> worker -> Postgres -> HR.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build images & start stack
        working-directory: infra
        run: docker compose --profile app up -d --build --quiet-pull
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: integration-tests/requirements.txt
      - name: Run integration tests
        working-directory: integration-tests
        run: |
          pip install -r requirements.txt
          pytest -v
      - name: Service logs (khi loi)
        if: failure()
        working-directory: infra
        run: docker compose --profile app logs --no-color --tail=200
      - name: Stop stack
        if: always()
        working-directory: infra
        run: docker compose --profile app down -v
