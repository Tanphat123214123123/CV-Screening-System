# Tu dong mo PR cap nhat thu vien.
#
# Nguyen tac (sau lan dau bi ngap 19 PR):
# - Minor / patch: gom 1 PR moi he sinh thai, merge khi CI xanh.
# - Major (Spring Boot 4, React 19, Vitest 5, Python 3.14...): KHONG tu mo PR. Ban major co breaking
#   change, can nang cap co chu dich (doc migration guide, sua code) thay vi bot tu day len.
#   Lo hong bao mat van duoc Dependabot security updates mo PR rieng (bat trong Settings > Security).
# - GitHub Actions: gom TAT CA (ke ca major) vao 1 PR moi thang - chi anh huong CI, CI tu kiem chung.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      backend:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /ai-worker
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      ai-worker:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      frontend:
        update-types: [minor, patch]

  # Image nen quyet dinh phien ban runtime (JDK / Python) luc deploy -> doi major phai co chu dich
  - package-ecosystem: docker
    directories: [/backend, /ai-worker]
    schedule: { interval: monthly }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      github-actions:
        patterns: ["*"]
