# Profile production: SPRING_PROFILES_ACTIVE=prod
# Nguyen tac: KHONG co gia tri mac dinh cho bat ky secret nao. Thieu bien moi truong
# -> backend tu choi khoi dong (fail fast) thay vi chay voi secret dev.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    # Production khong duoc tu baseline mot schema la
    baseline-on-migrate: false

app:
  jwt:
    secret: ${JWT_SECRET}
  auth:
    # Mac dinh tat dang ky HR cong khai; muon mo thi dat HR_INVITE_CODE
    hr-invite-code: ${HR_INVITE_CODE:}
  aws:
    # Mac dinh dung IAM role (DefaultCredentialsProvider), khong dung key tinh
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    s3-endpoint: ${S3_ENDPOINT:}
    sqs-endpoint: ${SQS_ENDPOINT:}
    auto-create-resources: ${AWS_AUTO_CREATE_RESOURCES:false}
  cors:
    allowed-origins: ${CORS_ORIGINS}

# Khong public tai lieu API tren production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
