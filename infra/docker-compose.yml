# Ha tang chay local — mo phong day du AWS (S3 -> MinIO, SQS -> ElasticMQ)
# Chay:  docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: cvs-postgres
    environment:
      POSTGRES_DB: cvscreening
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Map ra 5433 (khong phai 5432 mac dinh) vi nhieu may Windows/macOS da
      # co san mot PostgreSQL native chay nhu service, chiem san cong 5432.
      # Ket noi tu backend chay local: dat DB_PORT=5433.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible storage cho moi truong dev
  # Luu y: MinIO da ngung phat hanh image mien phi (Docker Hub minio/minio da bi go,
  # quay.io/minio/* tra ve 401). Dung ban build cong dong cua Pigsty tu ma nguon
  # MinIO (cung CLI/API). Ghim tag cu the de moi may pull ra cung mot ban.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: cvs-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - miniodata:/data

  # Tao san bucket cv-bucket khi khoi dong (khong bat buoc: backend cung tu tao bucket)
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/cv-bucket;
      exit 0;
      "

  # SQS-compatible queue cho moi truong dev
  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    container_name: cvs-elasticmq
    ports:
      - "9324:9324"
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf

  # ==== Backend + AI worker chay bang Docker (profile "app") ====
  # Mac dinh `docker compose up -d` chi bat ha tang (dev chay backend/worker tren may).
  # Chay ca he thong trong Docker - CI dung cach nay cho integration test:
  #   docker compose --profile app up -d --build
  backend:
    profiles: ["app"]
    build: ../backend
    container_name: cvs-backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      S3_ENDPOINT: http://minio:9000
      # Presigned URL duoc TRINH DUYET mo: phai ky voi host trinh duyet thay duoc, khong phai "minio"
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      SQS_ENDPOINT: http://elasticmq:9324
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      elasticmq:
        condition: service_started
    # MinIO/ElasticMQ chua san sang luc backend kiem tra bucket/queue -> backend dung (fail fast) va tu khoi dong lai
    restart: on-failure

  ai-worker:
    profiles: ["app"]
    build: ../ai-worker
    container_name: cvs-ai-worker
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/cvscreening
      S3_ENDPOINT: http://minio:9000
      SQS_ENDPOINT: http://elasticmq:9324
      POLL_WAIT_SECONDS: "2"
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy
      elasticmq:
        condition: service_started
    restart: on-failure

volumes:
  pgdata:
  miniodata:
